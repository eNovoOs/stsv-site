<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte interne des arrêts — STSV</title>

<!-- Page interne : elle n'est liée depuis aucune page du site et ne doit pas
     etre indexee. Elle reste toutefois accessible a qui connait l'adresse :
     ce n'est pas une protection, seulement une absence de reference. -->
<meta name="robots" content="noindex, nofollow">

<link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
<script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css">
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

<link rel="icon" href="/favicon.ico" sizes="48x48">

<style>
@font-face{font-family:Poppins;font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/poppins-latin-700-normal.woff2) format('woff2')}
/* JetBrains Mono : reservee aux donnees techniques — ici les numeros d'arret. */
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}

:root {
  --blue: #135EEF;
  --blue-dark: #0B3FB4;
  --cyan: #45C3CF;
  --ink: #111827;
  --gray-600: #4B5563;
  --gray-100: #E5E7EB;
  --gray-air: #F5F9FC;
  --white: #fff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Poppins, 'Segoe UI', system-ui, sans-serif; color: var(--ink); background: var(--white); -webkit-text-size-adjust: 100%; }
html, body { overflow-x: hidden; }
button, input { font: inherit; }
button { touch-action: manipulation; }

/* Visible seulement pour les lecteurs d'ecran. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}

.shell { position: relative; height: 100vh; height: 100svh; min-height: 540px; width: 100%; isolation: isolate; }
#map { position: absolute; inset: 0; background: #e5e5e5; }

/* -------- Recherche -------- */
.search-zone {
  position: absolute; top: 18px; left: 18px; z-index: 110;
  width: min(370px, calc(100vw - 36px));
  display: grid; gap: 8px;
}
.mapboxgl-ctrl-geocoder { min-width: 100%; width: 100%; font-family: Poppins, sans-serif; box-shadow: 0 6px 22px rgba(17,24,39,.16); }
.mapboxgl-ctrl-geocoder--input:focus { outline: 2px solid var(--blue); outline-offset: -2px; }

.hint {
  background: rgba(255,255,255,.96); border-radius: 10px; padding: 9px 12px;
  font-size: 12px; line-height: 1.45; color: var(--gray-600);
  box-shadow: 0 4px 16px rgba(17,24,39,.10);
}
.hint strong { color: var(--ink); font-weight: 600; }
.hint .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--blue); }

/* -------- Compteur + bascule des numeros -------- */
.tools {
  position: absolute; top: 18px; right: 18px; z-index: 110;
  display: grid; gap: 8px; justify-items: end;
}
.pill {
  background: rgba(255,255,255,.96); border-radius: 999px; padding: 7px 14px;
  font-size: 12px; font-weight: 600; color: var(--gray-600);
  box-shadow: 0 4px 16px rgba(17,24,39,.10); border: 0;
}
.pill b { font-family: 'JetBrains Mono', monospace; color: var(--blue); }
button.pill { cursor: pointer; color: var(--ink); }
button.pill:hover { color: var(--blue); }
button.pill[aria-pressed="true"] { background: var(--blue); color: var(--white); }

/* -------- Panneau d'information -------- */
.panel {
  position: absolute; bottom: 18px; left: 18px; z-index: 120;
  width: min(340px, calc(100vw - 36px));
  background: var(--white); border-radius: 14px; padding: 18px 18px 16px;
  box-shadow: 0 10px 34px rgba(17,24,39,.20);
  border-left: 6px solid var(--blue);
  display: none;
}
.panel[data-open] { display: block; }
.panel__x {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px;
  border: 0; background: var(--gray-air); border-radius: 50%; cursor: pointer;
  color: var(--gray-600); font-weight: 700; line-height: 1;
}
.panel__x:hover { color: var(--ink); }
.panel__eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gray-600); margin-bottom: 4px;
}
.panel__num {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 34px; line-height: 1; color: var(--blue); margin-bottom: 10px;
}
.panel__name { font-size: 15px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.panel__sector { font-size: 12px; color: var(--gray-600); margin-bottom: 14px; }
.panel__copy {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--blue); color: var(--white); border: 0; border-radius: 8px;
  padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.panel__copy:hover { background: var(--blue-dark); }
.panel__copy[data-done] { background: #17794A; }

/* -------- Legende -------- */
.legend {
  position: absolute; bottom: 18px; right: 18px; z-index: 100;
  background: rgba(255,255,255,.96); border-radius: 10px; padding: 10px 13px;
  font-size: 11px; color: var(--gray-600); box-shadow: 0 4px 16px rgba(17,24,39,.10);
  display: grid; gap: 6px;
}
.legend__row { display: flex; align-items: center; gap: 7px; }
.legend__dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; flex: 0 0 auto; }

@media (max-width: 760px) {
  .search-zone { top: 12px; left: 12px; width: calc(100vw - 24px); }
  .tools { top: auto; bottom: 12px; right: 12px; }
  .panel { left: 12px; right: 12px; width: auto; bottom: 62px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<h1 class="sr-only" id="page-title">Carte interne des arrêts — STSV</h1>

<div class="shell">
  <div id="map"></div>

  <div class="search-zone">
    <div id="geocoder"></div>
    <p class="hint" id="hint"></p>
  </div>

  <div class="tools">
    <p class="pill" id="count"></p>
    <button class="pill" type="button" id="toggle-labels" aria-pressed="true"></button>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <button class="panel__x" type="button" id="panel-close" aria-label="Fermer">✕</button>
    <p class="panel__eyebrow" id="panel-eyebrow"></p>
    <p class="panel__num" id="panel-num"></p>
    <p class="panel__name" id="panel-name"></p>
    <p class="panel__sector" id="panel-sector"></p>
    <button class="panel__copy" type="button" id="panel-copy"></button>
  </aside>

  <div class="legend">
    <div class="legend__row"><span class="legend__dot" style="background:#FFC107"></span><span id="lg-stop"></span></div>
    <div class="legend__row"><span class="legend__dot" style="background:#D50000"></span><span id="lg-sel"></span></div>
    <div class="legend__row"><span class="legend__dot" style="background:#135EEF"></span><span id="lg-ref"></span></div>
  </div>
</div>

<!-- Les arrets viennent du meme fichier que la carte publique : une seule
     source de verite, pour qu'un arret ajoute ou deplace n'ait pas a etre
     saisi deux fois. -->
<script src="/carte/data.js"></script>
<script src="./app.js"></script>
</body>
</html>
